services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/public:/var/www/public:ro
    depends_on:
      - backend
    networks:
      - tabloncito

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./backend/views:/app/views:ro
      - ./backend/public:/app/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - tabloncito
    restart: unless-stopped

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - BACKEND_INTERNAL_URL=http://backend:3000
    networks:
      - tabloncito
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tabloncito}
      POSTGRES_USER: ${POSTGRES_USER:-tabloncito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tabloncito}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tabloncito
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"
    networks:
      - tabloncito
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:

networks:
  tabloncito:
    driver: bridge
